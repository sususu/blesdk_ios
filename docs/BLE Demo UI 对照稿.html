const destructive=k=>/delete|unbind_watch/.test(k);
function grid(keys,selected=''){return '<div class="grid">'+keys.map(k=>`<button class="tile ${primary.has(k)?'primary':''} ${destructive(k)?'destructive':''} ${k===selected?'selected':''}" data-key="${esc(k)}" title="${esc(t(k))}" aria-label="${esc(t(k))}" ${$('state').value==='busy'?'disabled':''}><span>${esc(t(k))}</span></button>`).join('')+'</div>'}
function card(title,body){return `<section class="card">${title?`<h2 class="heading">${esc(t(title))}</h2>`:''}${body}</section>`}
const copy=text=>`<div class="copy">${esc(text)}</div>`;
function status(){const p=DATA.pages.find(p=>p.id===current);let lines=t('feature_ready');
if(['ota','jieliOta'].includes(p.id))lines+='\n'+t('ota_mac').replace('%@','AA:BB:CC:DD:EE:FF')+'\n'+t('ota_firmware').replace('%@','1.0.0')+'\n'+t('ota_parsed').replace('%@','1.0.0');
if(p.id==='agps')lines+='\n'+t('agps_gps_clip').replace('%@','—')+'\n'+t('agps_gps_fw').replace('%@','—').replace('%d','0')+'\n'+t('agps_valid_dash');
if(p.id==='music')lines+='\n—';if(p.id==='album')lines+='\n'+t('album_none_selected');
if(p.kind==='aiwatch')lines=t('wf_ai_hint');if(p.kind==='aidemo')lines=t('ai_demo_hint');
return card('ui_status',copy(lines))}

const logs=()=>card('',`<button class="tile logbutton" data-log><span>${esc(t('home_show_logs'))}</span></button><div class="logs" hidden>09:41:00  Demo UI ready\n09:41:02  Sample device connected\n09:41:03  Waiting for action…</div>`);
function fields(names=['W','H','Corner','ThumbW','ThumbH','ThumbR']){let rows='';for(let i=0;i<names.length;i+=2)rows+=`<div class="formrow"><label>${esc(names[i])}</label><input aria-label="${esc(names[i])}" value="${i===0?'466':'0'}"><label>${esc(names[i+1]||'')}</label>${names[i+1]?`<input aria-label="${esc(names[i+1])}" value="${i===0?'466':'0'}">`:''}</div>`;return rows}
function toggles(keys){return keys.map(k=>`<label class="setting"><span>${esc(t(k))}</span><input class="toggle" type="checkbox" checked aria-label="${esc(t(k))}"></label>`).join('')}
function preview(){return `<div class="preview"><div class="watch"><small>FRIDAY 16</small>09:41<small>8,200 STEPS</small></div></div>`}
function tabs(p){return `<div class="tabs">${['Custom','Online','Ai'].map((v,i)=>`<button data-page="${p.family+v}" class="${p.id===p.family+v?'active':''}">${esc(t(['wf_tab_custom','wf_tab_online','wf_tab_ai'][i]))}</button>`).join('')}</div>`}
function render(){const p=DATA.pages.find(p=>p.id===current);$('title').textContent=t(p.title);$('phone').style.width=$('width').value+'px';$('phone').classList.toggle('dark',$('theme').value==='dark');let out='';$('homeLog').innerHTML='';
if(p.kind==='home'){out=p.groups.map((g,i)=>card(g.title,(i===0?copy(lang==='zh'?'已连接 · Demo Watch\nAA:BB:CC:DD:EE:FF\n已绑定':'Connected · Demo Watch\nAA:BB:CC:DD:EE:FF\nBound'):'')+grid(g.actions))).join('');$('homeLog').innerHTML=logs()}
else if(p.kind==='monitor'){out=card('',toggles(p.actions))+copy(t('jieli_monitor_note'))}

else if(p.kind==='health'){out=card('ui_actions',`<div style="max-height:300px;overflow:auto">${grid(p.actions)}</div>`)+copy(lang==='zh'?'请选择要读取的数据。操作区与结果区独立滚动。':'Select data to read. Actions and results scroll independently.')+results()}
else if(p.kind==='custom'){out=tabs(p)+status()+card('ui_preview',preview())+card('ui_parameters',fields()+toggles(p.family?[]:['wf_widget_date','wf_widget_week','wf_widget_step','wf_widget_weather','wf_widget_pointer']));if(p.family){out+=card('wf_pick_bg',copy(lang==='zh'?'背景图片 0 / 5':'Background photos 0 / 5')+grid(p.actions.slice(0,3)))+card('ui_parameters',copy(t('wf_jl_display_mode'))+`<select aria-label="Display mode"><option>数字 / Digital</option><option>指针 / Analog</option></select>`+'<div class="grid">'+[1,2,3,4].map(i=>'<button class="tile"><span>'+esc(t('wf_jl_component_slot').replace('%d',i).replace('%@',t('wf_jl_component_off')))+'</span></button>').join('')+'</div>'+copy(t('wf_jl_text_color')));out+=card('ui_actions',grid(p.actions.slice(3)))}else out+=card('ui_actions',grid(p.actions))+card('ui_results','<div class="progress"></div>');out+=logs()}

else if(p.kind==='aiwatch'||p.kind==='aidemo'){out=(p.kind==='aiwatch'?tabs(p):'')+status()+card('ui_parameters',fields()+toggles(p.kind==='aidemo'?['ai_platform_jieli']:['wf_ai_style_anime','wf_ai_style_pencil']))+card('ui_actions',grid(p.actions))+card('ui_results',copy(t('wf_ai_result'))+preview()+copy(t('wf_ai_preview'))+preview()+'<div class="progress"></div>')+logs()}

function fitText(){document.querySelectorAll('.tile span').forEach(s=>{
let size=15;s.style.fontSize=size+'px';
while(size>7.5&&s.scrollHeight>Math.ceil(size*1.2*2)+1){size-=0.5;s.style.fontSize=size+'px'}
})}
function navigate(id){current=id;render()}
function notify(message){$('toast').textContent=message;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').textContent='',2000)}
document.addEventListener('click',e=>{const page=e.target.closest('[data-page]');if(page){navigate(page.dataset.page);return}const log=e.target.closest('[data-log]');if(log){const box=log.nextElementSibling;box.hidden=!box.hidden;log.querySelector('span').textContent=t(box.hidden?'home_show_logs':'home_hide_logs');fitText();return}const b=e.target.closest('[data-key]');if(!b||b.disabled)return;const k=b.dataset.key;if(route[k]){navigate(route[k]);return}if(destructive(k)){$('confirm').showModal();return}if(k.startsWith('jieli_measure_')&&k!=='jieli_measure_start'){document.querySelectorAll('.selected').forEach(el=>el.classList.remove('selected'));b.classList.add('selected');return}if(k==='jieli_measure_start'){$('reading').textContent='72 bpm';return}document.querySelectorAll('.result').forEach(r=>r.textContent=lang==='zh'?'示例结果：'+t(k):'Sample result: '+t(k));notify(lang==='zh'?'视觉预览：'+t(k):'UI preview: '+t(k))});
